<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>থাম্বনেইল মেকার</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@100..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f3f1;--card:#ffffff;--ink:#1b1b1b;--sub:#6a6a66;--line:#dcdcd6;--accent:#e01b0e;--accent-ink:#fff;--field:#fafaf8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111112;--card:#1b1b1d;--ink:#f1f1ef;--sub:#a0a0a0;--line:#333336;--field:#242427;}
}
:root[data-theme="dark"]{--bg:#111112;--card:#1b1b1d;--ink:#f1f1ef;--sub:#a0a0a0;--line:#333336;--field:#242427;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;font-size:17px;line-height:1.5}
main{max-width:600px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:19px;margin:4px 2px 10px;font-weight:700}
.preview{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;position:sticky;top:0;z-index:20;box-shadow:0 6px 16px rgba(0,0,0,.14)}
canvas#cv{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:8px;background:#000}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
label:first-child{margin-top:0}
.hint{color:var(--sub);font-size:13px;font-weight:400}
input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent)}
button,.filebtn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;width:100%;display:block;text-align:center}
.filebtn{background:var(--field);color:var(--ink);border:1px dashed var(--sub)}
.primary{background:var(--accent);color:var(--accent-ink);margin-top:14px;font-size:18px}
.secondary{background:var(--field);color:var(--ink);border:1px solid var(--line);margin-top:10px}
.rowbox{margin-top:10px}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1;min-width:0}
.row .sty{width:92px;height:50px;flex:none;padding:0;background:#0a0a0a;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;display:block}
.row .sty canvas{display:block;width:100%;height:100%}
.row .x,.row .gear{width:40px;flex:none;padding:10px 0;background:var(--field);color:var(--sub);border:1px solid var(--line);border-radius:10px}
.row .gear{color:var(--ink);font-size:15px}
.row .gear.on{border-color:var(--accent);color:var(--accent)}
.rset{margin-top:8px;padding:10px 12px 12px;background:var(--field);border:1px solid var(--line);border-radius:12px}
.rowbox>.fontbtn{margin-top:6px;padding:9px 12px;text-align:left;font-size:15px}
.rset label{margin:10px 0 2px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.acc{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.acc summary{list-style:none;cursor:pointer;font-weight:700;font-size:15px;padding:10px 2px;display:flex;justify-content:space-between;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"＋";color:var(--accent);font-size:20px;line-height:1}
.acc[open] summary::after{content:"－"}
.accbody{padding-bottom:6px}
.check{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-weight:600;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
#msg{margin-top:10px;font-size:14px;color:var(--sub);min-height:20px}
#fallback{display:none;margin-top:12px}
#fallback img{width:100%;border-radius:8px}
input[type=file]{display:none}
.small{width:auto;display:inline-block;padding:8px 14px;font-size:14px;margin-top:8px}
/* স্টাইল বাছাইয়ের শিট */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.sheetbox{background:var(--card);width:100%;max-width:600px;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sheethead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-14px;background:var(--card);padding:6px 0 10px;z-index:2}
.sheethead b{font-size:17px}
.sheethead button{width:auto;padding:8px 16px;background:var(--field);color:var(--ink);border:1px solid var(--line)}
.grp{font-weight:700;font-size:14px;color:var(--sub);margin:10px 0 6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{padding:0;background:transparent;border:2px solid transparent;border-radius:12px;overflow:hidden;text-align:center;color:var(--ink);font-size:12px;font-weight:600}
.chip canvas{display:block;width:100%;height:auto;border-radius:9px;background:#0a0a0a}
.chip span{display:block;padding:3px 2px 4px;line-height:1.2}
.chip.sel{border-color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>থাম্বনেইল মেকার</h1>
  <div class="preview"><canvas id="cv" width="1280" height="720" aria-label="থাম্বনেইলের প্রিভিউ"></canvas></div>

  <div class="panel">
    <label class="filebtn" for="photo" id="photoLbl">ছবি বাছুন</label>
    <input type="file" id="photo" accept="image/*">

    <label style="margin-top:16px">লেখা <span class="hint">(স্টাইল বক্সে চাপ দিন; নিচের "ফন্ট" বাটনে ফন্ট বাছুন; Aa চেপে সাইজ ও মোটা-চিকন)</span></label>
    <div id="rows"></div>
    <button class="secondary" id="addRow" type="button">＋ আরেক লাইন যোগ করুন</button>

    <details class="acc">
      <summary>সব লেখার সেটিং (সাইজ, ফাঁক)</summary>
      <div class="accbody">
        <label for="tscale">সব লেখা একসাথে বড়-ছোট: <span id="tscaleVal">100</span>%</label>
        <input type="range" id="tscale" min="60" max="130" value="100">
        <label for="gap">লাইনের মাঝের ফাঁক: <span id="gapVal">14</span></label>
        <input type="range" id="gap" min="0" max="50" value="14">
      </div>
    </details>

    <details class="acc">
      <summary>ব্যাকগ্রাউন্ড ও লেআউট</summary>
      <div class="accbody">
        <label for="side">ছবি কোন পাশে</label>
        <select id="side"><option value="left">বাম পাশে (লেখা ডানে)</option><option value="right">ডান পাশে (লেখা বামে)</option></select>
        <label for="pan">লেখার ব্যাকগ্রাউন্ড মুখের দিকে আনুন: <span id="panVal">55</span> <span class="hint">(বেশি = ছবি ছোট, ব্যাকগ্রাউন্ড মুখের কাছে)</span></label>
        <input type="range" id="pan" min="0" max="100" value="55">
        <label for="pcol">ব্যাকগ্রাউন্ডের রং</label>
        <select id="pcol">
          <option value="#000000|#0c0c10">কালো</option>
          <option value="#f3f3f1|#d8d8d2">হালকা ধূসর (সাদা)</option>
          <option value="#07173d|#020817">গাঢ় নীল</option>
          <option value="#2d060b|#0a0102">গাঢ় লাল</option>
          <option value="#04291f|#010d09">গাঢ় সবুজ</option>
          <option value="#2e1607|#0b0502">গাঢ় বাদামি</option>
          <option value="#1d0a3c|#07030f">গাঢ় বেগুনি</option>
        </select>
        <label for="glow">ব্যাকগ্রাউন্ডে রঙিন আলো</label>
        <select id="glow">
          <option value="none">নেই</option>
          <option value="255,40,20">লাল আলো</option>
          <option value="255,196,40">সোনালি আলো</option>
          <option value="40,140,255">নীল আলো</option>
          <option value="40,220,120">সবুজ আলো</option>
        </select>
        <label for="edge">ছবির কিনারা</label>
        <select id="edge"><option value="soft">নরম ফেড</option><option value="hard">সোজা কাটা</option></select>
        <label for="border">বর্ডার</label>
        <select id="border">
          <option value="none">নেই</option>
          <option value="#ffffff">সাদা</option>
          <option value="#ffd24a">সোনালি</option>
          <option value="#ff1a0e">লাল</option>
        </select>
      </div>
    </details>

    <details class="acc">
      <summary>ছবি অ্যাডজাস্ট (বড়-ছোট, উজ্জ্বলতা)</summary>
      <div class="accbody">
        <label>ছবি বড়-ছোট করুন</label>
        <input type="range" id="zoom" min="100" max="300" value="100">
        <label>ছবি ডানে-বামে</label>
        <input type="range" id="px" min="0" max="100" value="50">
        <label>ছবি উপরে-নিচে</label>
        <input type="range" id="py" min="0" max="100" value="30">
        <label for="bri">উজ্জ্বলতা: <span id="briVal">106</span>%</label>
        <input type="range" id="bri" min="70" max="150" value="106">
        <label for="con">কনট্রাস্ট: <span id="conVal">112</span>%</label>
        <input type="range" id="con" min="70" max="160" value="112">
        <label for="sat">রং-ঘনত্ব: <span id="satVal">118</span>%</label>
        <input type="range" id="sat" min="50" max="170" value="118">
      </div>
    </details>

    <details class="acc">
      <summary>ব্যাজ ও লোগো (ঐচ্ছিক)</summary>
      <div class="accbody">
        <label for="badge">ছোট ব্যাজ <span class="hint">(যেমন: নতুন ওয়াজ, LIVE, পর্ব ১)</span></label>
        <input type="text" id="badge" placeholder="খালি রাখলে কিছু দেখাবে না">
        <label for="bcol">ব্যাজের রং</label>
        <select id="bcol">
          <option value="#ff1a0e|#ffffff">লাল</option>
          <option value="#ffe600|#111111">হলুদ</option>
          <option value="#12b954|#ffffff">সবুজ</option>
          <option value="#1f7bff|#ffffff">নীল</option>
          <option value="#ffffff|#111111">সাদা</option>
        </select>
        <label class="filebtn" for="logoFile" id="logoLbl" style="margin-top:14px">চ্যানেলের লোগো বাছুন</label>
        <input type="file" id="logoFile" accept="image/*">
        <button class="secondary small" id="logoClear" type="button" style="display:none">লোগো সরান</button>
      </div>
    </details>
  </div>

  <button class="primary" id="save">থাম্বনেইল সেভ করুন</button>
  <button class="secondary" id="share" style="display:none">শেয়ার করুন</button>
  <div id="msg" role="status"></div>
  <div id="fallback"><p style="font-weight:700;margin:0 0 8px">তৈরি থাম্বনেইল <span class="hint">(সেভ না হলে ছবিতে চেপে ধরে "ছবি সংরক্ষণ" দিন)</span></p><img id="outImg" alt="তৈরি থাম্বনেইল"></div>
</main>

<div id="sheet" role="dialog" aria-label="স্টাইল বাছুন">
  <div class="sheetbox">
    <div class="sheethead"><b id="sheetTitle">লেখার স্টাইল বাছুন</b><button type="button" id="sheetClose">বন্ধ</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<input type="file" id="fontFile">
<script>
const W=1280,H=720;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const FONT="'Anek Bangla','Hind Siliguri','Noto Sans Bengali',sans-serif";
const BNUM=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);

/* ---------- লেখার স্টাইল ---------- */
const STY={
  yellow:{g:'লেখা',n:'হলুদ',fill:'#ffe600'},
  white:{g:'লেখা',n:'সাদা',fill:'#ffffff'},
  orange:{g:'লেখা',n:'কমলা',fill:'#ff9a00'},
  lime:{g:'লেখা',n:'লেবু-সবুজ',fill:'#d9f400'},
  gold:{g:'লেখা',n:'সোনালি গ্রেডিয়েন্ট',fill:['#fff6b0','#ffb400'],stroke:['#4a2600',.035]},
  fire:{g:'লেখা',n:'আগুন',fill:['#ffee00','#ff2a00']},
  silver:{g:'লেখা',n:'রুপালি',fill:['#ffffff','#9db2c8'],stroke:['#0b1a2a',.03]},
  outy:{g:'লেখা',n:'হলুদ + কালো কিনারা',fill:'#ffe600',stroke:['#000000',.1]},
  outw:{g:'লেখা',n:'সাদা + কালো কিনারা',fill:'#ffffff',stroke:['#000000',.1]},
  blk:{g:'লেখা',n:'কালো (হালকা ব্যাকগ্রাউন্ডে)',fill:'#161616',sh:{t:'none'},light:true},
  redf:{g:'লেখা',n:'গাঢ় লাল (হালকা ব্যাকগ্রাউন্ডে)',fill:'#e01b0e',sh:{t:'none'},light:true},
  redw:{g:'লেখা',n:'লাল + সাদা কিনারা',fill:'#ff1a0e',stroke:['#ffffff',.08]},
  yelr:{g:'লেখা',n:'হলুদ + লাল কিনারা',fill:'#ffe600',stroke:['#c40d00',.09]},
  whtr:{g:'লেখা',n:'সাদা + লাল কিনারা',fill:'#ffffff',stroke:['#e01b0e',.09]},
  whtb:{g:'লেখা',n:'সাদা + নীল কিনারা',fill:'#ffffff',stroke:['#0a3fd1',.09]},
  orgb:{g:'লেখা',n:'কমলা + কালো কিনারা',fill:'#ff9a00',stroke:['#000000',.1]},
  limb:{g:'লেখা',n:'লেবু-সবুজ + কালো কিনারা',fill:'#d9f400',stroke:['#000000',.1]},
  dbl1:{g:'লেখা',n:'ডবল কিনারা হলুদ-লাল-কালো',fill:'#ffe600',stroke:['#d10a00',.07],stroke2:['#000000',.14]},
  dbl2:{g:'লেখা',n:'ডবল কিনারা সাদা-নীল-কালো',fill:'#ffffff',stroke:['#1558e8',.07],stroke2:['#000000',.14]},
  grng:{g:'লেখা',n:'সবুজ গ্রেডিয়েন্ট',fill:['#c6ff7a','#12b954'],stroke:['#03260f',.04]},
  blug:{g:'লেখা',n:'নীল গ্রেডিয়েন্ট',fill:['#a8ecff','#1f7bff'],stroke:['#031a47',.04]},
  pnkg:{g:'লেখা',n:'গোলাপি গ্রেডিয়েন্ট',fill:['#ffd6f1','#ff2d95'],stroke:['#4a0030',.04]},
  redg:{g:'লেখা',n:'লাল গ্রেডিয়েন্ট + সাদা কিনারা',fill:['#ff9078','#c40000'],stroke:['#ffffff',.05]}
};
const STY_KEYS=Object.keys(STY);

const FONTS={
  anek:{n:'আনেক বাংলা',f:"'Anek Bangla'",mx:800,sx:1},
  anekc:{n:'আনেক বাংলা (সরু)',f:"'Anek Bangla'",mx:800,sx:.8},
  noto:{n:'নোটো সান্স',f:"'Noto Sans Bengali'",mx:900,sx:1},
  notoc:{n:'নোটো সান্স (সরু)',f:"'Noto Sans Bengali'",mx:900,sx:.8},
  hind:{n:'হিন্দ শিলিগুড়ি',f:"'Hind Siliguri'",mx:700,sx:1},
  mukta:{n:'মুক্তা',f:"'Mukta'",mx:800,sx:1},
  anekx:{n:'আনেক অতিসরু',f:"'Anek Bangla'",mx:800,sx:.66},
  aneki:{n:'আনেক ঢালু',f:"'Anek Bangla'",mx:800,sx:1,sk:-.2},
  anekb:{n:'আনেক অতিমোটা',f:"'Anek Bangla'",mx:800,sx:1,ex:2.4},
  anekw:{n:'আনেক চওড়া',f:"'Anek Bangla'",mx:800,sx:1.12},
  notoi:{n:'নোটো ঢালু',f:"'Noto Sans Bengali'",mx:900,sx:1,sk:-.2},
  notob:{n:'নোটো অতিমোটা',f:"'Noto Sans Bengali'",mx:900,sx:1,ex:2.4},
  notox:{n:'নোটো অতিসরু',f:"'Noto Sans Bengali'",mx:900,sx:.66},
  hindc:{n:'হিন্দ সরু',f:"'Hind Siliguri'",mx:700,sx:.8},
  hindb:{n:'হিন্দ অতিমোটা',f:"'Hind Siliguri'",mx:700,sx:1,ex:2.4},
  muktac:{n:'মুক্তা সরু',f:"'Mukta'",mx:800,sx:.8},
  muktai:{n:'মুক্তা ঢালু',f:"'Mukta'",mx:800,sx:1,sk:-.2}
};
const FONT_KEYS=Object.keys(FONTS);
FONT_KEYS.forEach(k=>{FONTS[k].k=k;FONTS[k].css=FONTS[k].f+",'Hind Siliguri','Noto Sans Bengali',sans-serif"});
function boldVals(v,fo){if(fo.cust)return {w:400,extra:Math.max(0,v-8)*.5};return {w:Math.min(fo.mx,200+v*60),extra:Math.max(0,v-10)+(fo.ex||0)}}
function fontReady(k){
  const fo=FONTS[k];
  if(!(document.fonts&&document.fonts.load))return Promise.resolve();
  return Promise.all([400,800].map(w=>document.fonts.load(w+' 80px '+fo.f,'অআকখ প্রিমিয়াম খাবার'))).catch(()=>{});
}
const needed=new Set();
const CF_DB='thumb-fonts';
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(CF_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbAll(){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('f').objectStore('f').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbPut(o){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('f','readwrite');tx.objectStore('f').put(o);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function idbDel(id){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('f','readwrite');tx.objectStore('f').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function registerCustom(o){
  const key='c'+o.id,fam='CF'+o.id,ff=new FontFace(fam,o.buf);
  await ff.load();document.fonts.add(ff);
  FONTS[key]={n:o.name,f:"'"+fam+"'",mx:400,sx:1,cust:true,k:key,id:o.id,ff,css:"'"+fam+"','Hind Siliguri','Noto Sans Bengali',sans-serif"};
  FONT_KEYS.push(key);needed.add(key);return key;
}
async function delCustom(k,d){
  const fo=FONTS[k];try{await idbDel(fo.id)}catch(e){}
  try{document.fonts.delete(fo.ff)}catch(e){}
  [...$('rows').children].forEach(r=>{if(r.dataset.font===k){r.dataset.font='anek';updFontBtn(r);refreshRowPreview(r)}});
  FONT_KEYS.splice(FONT_KEYS.indexOf(k),1);delete FONTS[k];needed.delete(k);
  draw();openSheet(d,'font');
}
function need(k){if(needed.has(k))return;needed.add(k);fontReady(k).then(()=>{refreshAllPreviews();draw()})}
function fillFor(c,fill,cy,sz){
  if(Array.isArray(fill)){const g=c.createLinearGradient(0,cy-sz*.55,0,cy+sz*.6);g.addColorStop(0,fill[0]);g.addColorStop(1,fill[1]);return g}
  return fill;
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function padOf(s){
  if(s.box)return s.pad!==undefined?s.pad:.62;
  let p=.04;if(s.stroke)p+=(s.stroke2?s.stroke2[1]:s.stroke[1])*1.1;if(s.sh&&s.sh.t==='hard')p+=.07;if(s.sh&&s.sh.t==='glow')p+=.06;return p;
}
function drawLine(c,text,cx,cy,sz,s,bv,fo){
  c.font=bv.w+' '+sz+'px '+fo.css;c.textAlign='center';c.textBaseline='middle';
  const sx=fo.sx||1,tw=c.measureText(text).width*sx;
  c.textBaseline='alphabetic';
  const mm=c.measureText(text),asc=mm.actualBoundingBoxAscent||sz*.5,dsc=Math.min(mm.actualBoundingBoxDescent||0,sz*.1);
  const ty=cy+(asc-dsc)/2;
  let tcol=s.fill;
  if(s.box){
    const bw=tw+sz*padOf(s),bh=sz*1.34,r=bh*(s.flat?.12:.3);
    c.save();c.translate(cx,cy);
    if(s.skew)c.transform(1,0,s.skew,1,0,0);
    if(!s.flat){c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=sz*.15;c.shadowOffsetY=sz*.05}
    if(Array.isArray(s.box)){const g=c.createLinearGradient(0,-bh/2,0,bh/2);g.addColorStop(0,s.box[0]);g.addColorStop(1,s.box[1]);c.fillStyle=g}else c.fillStyle=s.box;
    rr(c,-bw/2,-bh/2,bw,bh,r);c.fill();
    c.shadowColor='transparent';
    if(s.bd){c.lineWidth=sz*s.bd[1];c.strokeStyle=s.bd[0];rr(c,-bw/2,-bh/2,bw,bh,r);c.stroke()}
    c.restore();
    tcol=s.tc;
  }
  const fs=fillFor(c,tcol,cy,sz);
  c.save();
  const sk=fo.sk||0;if(sx!==1||sk){c.translate(cx,ty);if(sk)c.transform(1,0,sk,1,0,0);c.scale(sx,1);c.translate(-cx,-ty)}
  c.lineJoin='round';c.miterLimit=2;
  const sh=s.sh;
  if(sh&&sh.t==='hard'){
    c.fillStyle=sh.c;const n=7,st=sz*.011;
    for(let i=n;i>=1;i--)c.fillText(text,cx+i*st,ty+i*st);
  }
  if(s.stroke2){c.save();if(!s.box){c.shadowColor='rgba(0,0,0,.7)';c.shadowBlur=sz*.12;c.shadowOffsetY=sz*.04}c.lineWidth=sz*s.stroke2[1]*2;c.strokeStyle=s.stroke2[0];c.strokeText(text,cx,ty);c.restore()}
  if(s.stroke){
    c.save();
    if(!s.box){c.shadowColor='rgba(0,0,0,.7)';c.shadowBlur=sz*.12;c.shadowOffsetY=sz*.04}
    c.lineWidth=sz*s.stroke[1]*2;c.strokeStyle=s.stroke[0];c.strokeText(text,cx,ty);c.restore();
  }
  if(!s.box&&!s.stroke&&!(sh&&sh.t==='hard')){
    if(sh&&sh.t==='glow'){
      c.shadowColor=sh.c;c.shadowBlur=sz*sh.k;c.fillStyle=fs;c.fillText(text,cx,ty);c.fillText(text,cx,ty);
    }else if(!(sh&&sh.t==='none')){c.shadowColor='rgba(0,0,0,.85)';c.shadowBlur=sz*.14;c.shadowOffsetY=sz*.04}
  }
  c.fillStyle=fs;c.fillText(text,cx,ty);
  c.shadowColor='transparent';
  if(bv.extra>0){c.lineWidth=sz*.016*bv.extra;c.strokeStyle=fs;c.strokeText(text,cx,ty)}
  c.restore();
  if(s.under){c.fillStyle=s.under;const uw=tw*1.02,uy=ty+sz*.1;rr(c,cx-uw/2,uy,uw,Math.max(5,sz*.075),sz*.04);c.fill()}
  return tw;
}

/* ---------- লাইন সারি ---------- */
let photo=null,logoImg=null,raf=0,activeRow=null;
const DEFAULT_ROWS=[['','yellow'],['','white'],['','orange']];
function paintChipCanvas(cvs,key,txt,fk,bval){
  const c=cvs.getContext('2d'),s=STY[key],fo=FONTS[fk]||FONTS.anek;
  c.clearRect(0,0,cvs.width,cvs.height);
  const g=c.createLinearGradient(0,0,cvs.width,cvs.height);
  if(s.light){g.addColorStop(0,'#f4f4f1');g.addColorStop(1,'#d9d9d3')}else{g.addColorStop(0,'#15151a');g.addColorStop(1,'#050506')}
  c.fillStyle=g;c.fillRect(0,0,cvs.width,cvs.height);
  const bv=boldVals(bval,fo),sz=cvs.height*.5;
  c.font=bv.w+' '+sz+'px '+fo.css;
  const tw=c.measureText(txt).width*(fo.sx||1);
  const f=Math.min(1,(cvs.width*.82)/(tw+sz*padOf(s)));
  drawLine(c,txt,cvs.width/2,cvs.height/2,sz*f,s,bv,fo);
}
function refreshRowPreview(d){
  paintChipCanvas(d.querySelector('.sty canvas'),d.dataset.sty,'আমার',d.dataset.font,+d.dataset.bold);
}
function updFontBtn(d){
  d.querySelector('.fontbtn').textContent='ফন্ট: '+BNUM(FONT_KEYS.indexOf(d.dataset.font)+1)+'. '+FONTS[d.dataset.font].n+'  ▾';
}
function addRow(text,sty,font){
  const rows=$('rows');if(rows.children.length>=6)return null;
  const prev=rows.lastElementChild;
  const d=document.createElement('div');d.className='rowbox';
  d.dataset.sty=sty||'white';d.dataset.font=font||(prev?prev.dataset.font:'anek');d.dataset.size='100';d.dataset.bold='10';
  d.innerHTML='<div class="row"><input type="text" placeholder="এখানে লিখুন"><button type="button" class="sty" aria-label="স্টাইল বাছুন"><canvas width="208" height="100"></canvas></button><button type="button" class="gear" aria-label="সাইজ ও মোটা-চিকন">Aa</button><button type="button" class="x" aria-label="লাইন মুছুন">✕</button></div>'
   +'<button type="button" class="secondary fontbtn"></button><div class="rset" hidden><label>এই লাইনের সাইজ: <span class="szv">১০০</span>%</label><input type="range" class="rsz" min="40" max="150" value="100"><label>এই লাইনের মোটা-চিকন: <span class="bdv">১০</span> <span class="hint">(১ = চিকন, ১২ = সবচেয়ে মোটা)</span></label><input type="range" class="rbd" min="1" max="12" value="10"></div>';
  const q=s=>d.querySelector(s);
  q('input[type=text]').value=text||'';
  q('input[type=text]').oninput=draw;
  q('.sty').onclick=()=>openSheet(d,'style');
  q('.gear').onclick=()=>{const st=q('.rset');st.hidden=!st.hidden;q('.gear').classList.toggle('on',!st.hidden)};
  q('.x').onclick=()=>{d.remove();draw()};
  q('.fontbtn').onclick=()=>openSheet(d,'font');
  q('.rsz').oninput=e=>{d.dataset.size=e.target.value;q('.szv').textContent=BNUM(e.target.value);draw()};
  q('.rbd').oninput=e=>{d.dataset.bold=e.target.value;q('.bdv').textContent=BNUM(e.target.value);refreshRowPreview(d);draw()};
  rows.appendChild(d);updFontBtn(d);refreshRowPreview(d);need(d.dataset.font);return d;
}
DEFAULT_ROWS.forEach(r=>addRow(r[0],r[1]));
$('addRow').onclick=()=>{addRow('',['white','yellow','lime','orange'][$('rows').children.length%4]);draw()};

/* ---------- স্টাইল ও ফন্ট বাছাইয়ের শিট (প্রতিটার সিরিয়াল নম্বর আছে) ---------- */
const STY_NUM={};STY_KEYS.forEach((k,i)=>STY_NUM[k]=i+1);
function openSheet(d,mode){
  activeRow=d;
  const body=$('sheetBody');body.innerHTML='';
  document.querySelector('.sheetbox').scrollTop=0;
  const bval=+d.dataset.bold,paints=[];
  if(mode==='font'){
    $('sheetTitle').textContent='ফন্ট বাছুন';
    const grid=document.createElement('div');grid.className='grid g2';
    FONT_KEYS.forEach((k,i)=>{
      const ch=document.createElement('button');ch.type='button';ch.className='chip'+(d.dataset.font===k?' sel':'');
      const cc=document.createElement('canvas');cc.width=300;cc.height=116;
      const sp=document.createElement('span');sp.textContent=BNUM(i+1)+'. '+FONTS[k].n;
      ch.append(cc,sp);
      const paint=()=>paintChipCanvas(cc,d.dataset.sty,'প্রিমিয়াম',k,bval);
      paint();paints.push(paint);
      ch.onclick=()=>{d.dataset.font=k;updFontBtn(d);need(k);refreshRowPreview(d);closeSheet();draw()};
      if(FONTS[k].cust){
        const w=document.createElement('div');w.append(ch);
        const dl=document.createElement('button');dl.type='button';dl.className='secondary small';dl.textContent='✕ মুছুন';dl.style.cssText='width:100%;margin-top:4px;padding:6px';
        dl.onclick=()=>delCustom(k,d);w.append(dl);grid.appendChild(w);
      }else grid.appendChild(ch);
    });
    const up=document.createElement('label');up.className='filebtn';up.htmlFor='fontFile';up.style.marginTop='12px';up.textContent='＋ নিজের ফন্ট যোগ করুন (.ttf / .otf)';
    const hn=document.createElement('div');hn.className='hint';hn.style.marginTop='6px';hn.textContent='ফন্ট শুধু আপনার ফোনের ব্রাউজারে থাকবে, কোথাও আপলোড হবে না।';
    body.appendChild(grid);body.append(up,hn);
    Promise.all(FONT_KEYS.map(fontReady)).then(()=>{if($('sheet').classList.contains('open'))paints.forEach(p=>p())});
  }else{
    $('sheetTitle').textContent='লেখার স্টাইল বাছুন';
    ['লেখা','বক্স','বিশেষ'].forEach(gn=>{
      if(!STY_KEYS.some(k=>STY[k].g===gn))return;
      const h=document.createElement('div');h.className='grp';h.textContent=gn==='লেখা'?'শুধু লেখা':gn==='বক্স'?'বক্সসহ লেখা':'বিশেষ স্টাইল';body.appendChild(h);
      const grid=document.createElement('div');grid.className='grid';
      STY_KEYS.filter(k=>STY[k].g===gn).forEach(k=>{
        const ch=document.createElement('button');ch.type='button';ch.className='chip'+(d.dataset.sty===k?' sel':'');
        const cc=document.createElement('canvas');cc.width=240;cc.height=116;
        const sp=document.createElement('span');sp.textContent=BNUM(STY_NUM[k])+'. '+STY[k].n;
        ch.append(cc,sp);paintChipCanvas(cc,k,'আমার',d.dataset.font,bval);
        ch.onclick=()=>{d.dataset.sty=k;refreshRowPreview(d);closeSheet();draw()};
        grid.appendChild(ch);
      });
      body.appendChild(grid);
    });
  }
  $('sheet').classList.add('open');
}
function closeSheet(){$('sheet').classList.remove('open')}
$('sheetClose').onclick=closeSheet;
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet()});

function getLines(){
  return [...$('rows').children].map(d=>{
    const fo=FONTS[d.dataset.font]||FONTS.anek;
    return {t:d.querySelector('input[type=text]').value.trim(),s:STY[d.dataset.sty]||STY.white,fo,
      k:parseInt(d.dataset.size,10)/100,bv:boldVals(parseInt(d.dataset.bold,10),fo)};
  }).filter(l=>l.t);
}

/* ---------- ছবি ও ব্যাকগ্রাউন্ড ---------- */
function geom(){
  const right=$('side').value==='right',pan=parseInt($('pan').value,10)/100;
  const PW=W*(.66-.2*pan);
  const x0=right?W-PW:0;
  return {right,PW,x0};
}
function panelFill(){
  const [a,b]=$('pcol').value.split('|');
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,a);g.addColorStop(1,b);return {g,a,b};
}
function hexA(hex,al){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${al})`}
function drawBase(){
  const G=geom(),P=panelFill();
  ctx.fillStyle=P.g;ctx.fillRect(0,0,W,H);
  const glow=$('glow').value;
  if(glow!=='none'){
    const gx=G.right?W*.22:W*.78;
    const rg=ctx.createRadialGradient(gx,H*.5,10,gx,H*.5,W*.5);
    rg.addColorStop(0,`rgba(${glow},.42)`);rg.addColorStop(1,`rgba(${glow},0)`);
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  }
  // ছবি
  const {PW,x0,right}=G;
  ctx.save();ctx.beginPath();ctx.rect(x0,0,PW,H);ctx.clip();
  if(photo){
    const z=$('zoom').value/100,px=$('px').value/100,py=$('py').value/100;
    const s=Math.max(PW/photo.width,H/photo.height)*z,dw=photo.width*s,dh=photo.height*s;
    try{ctx.filter=`brightness(${$('bri').value}%) contrast(${$('con').value}%) saturate(${$('sat').value}%)`}catch(e){}
    ctx.drawImage(photo,x0-(dw-PW)*px,-(dh-H)*py,dw,dh);
    ctx.filter='none';
    const vg=ctx.createRadialGradient(x0+PW*.5,H*.45,H*.3,x0+PW*.5,H*.5,H*.95);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.35)');
    ctx.fillStyle=vg;ctx.fillRect(x0,0,PW,H);
  }else{
    const g=ctx.createLinearGradient(x0,0,x0+PW,H);g.addColorStop(0,'#3a3f4a');g.addColorStop(1,'#15171c');
    ctx.fillStyle=g;ctx.fillRect(x0,0,PW,H);
    ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='700 46px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('ছবি বাছুন',x0+PW*.36,H/2);
  }
  ctx.restore();
  // কিনারার ফেড
  if($('edge').value==='soft'){
    const fw=PW*.42,a=right?x0:x0+PW-fw,b=right?x0+fw:x0+PW;
    const g=ctx.createLinearGradient(right?b:a,0,right?a:b,0);
    g.addColorStop(0,hexA(P.a,0));g.addColorStop(.55,hexA(P.a,.62));g.addColorStop(1,hexA(P.a,1));
    ctx.fillStyle=g;ctx.fillRect(a,0,fw,H);
  }
  // লেখার দিকের পূর্ণ ব্যাকগ্রাউন্ড
  ctx.fillStyle=P.g;
  if(right)ctx.fillRect(0,0,x0,H);else ctx.fillRect(x0+PW,0,W-PW,H);
  if(glow!=='none'){
    const gx=right?W*.22:W*.78;
    const rg=ctx.createRadialGradient(gx,H*.5,10,gx,H*.5,W*.5);
    rg.addColorStop(0,`rgba(${glow},.38)`);rg.addColorStop(1,`rgba(${glow},0)`);
    ctx.save();ctx.beginPath();if(right)ctx.rect(0,0,x0,H);else ctx.rect(x0+PW,0,W-PW,H);ctx.clip();
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);ctx.restore();
  }
}

function drawText(){
  const lines=getLines(),{right,PW,x0}=geom();
  const k=parseInt($('tscale').value,10)/100;$('tscaleVal').textContent=Math.round(k*100);
  const ov=W*.045;
  const tx0=right?36:PW-ov,tx1=right?x0+ov:W-36;
  const boxW=tx1-tx0,cx=(tx0+tx1)/2,top=34,boxH=H-68;
  const gapBase=parseInt($('gap').value,10);
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(!lines.length){ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='700 50px '+FONT;ctx.fillText('এখানে লেখা আসবে',cx,H/2);return}
  const items=lines.map(l=>{
    need(l.fo.k);
    ctx.font=l.bv.w+' 100px '+l.fo.css;
    const w100=ctx.measureText(l.t).width*(l.fo.sx||1),pw=w100/100+padOf(l.s);
    return {l,sz0:Math.min(boxW/pw,215*k),cap:(2*Math.min(cx,W-cx)-24)/pw};
  });
  const hm=it=>it.l.s.box?1.42:1.22;
  let f=1;
  for(;f>.3;f-=.02){const tt=items.reduce((a,it,i)=>a+it.sz0*f*hm(it)+(i?gapBase*f:0),0);if(tt<=boxH)break}
  items.forEach(it=>{it.sz=Math.min(it.sz0*f*it.l.k,it.cap);it.h=it.sz*hm(it)});
  const total=items.reduce((a,it,i)=>a+it.h+(i?gapBase*f:0),0);
  let y=top+(boxH-total)/2;
  items.forEach((it,i)=>{if(i)y+=gapBase*f;drawLine(ctx,it.l.t,cx,y+it.h/2,it.sz,it.l.s,it.l.bv,it.l.fo);y+=it.h});
}

function drawExtras(){
  const {right,PW,x0}=geom();
  // ব্যাজ
  const bt=$('badge').value.trim();
  if(bt){
    const [bg,fg]=$('bcol').value.split('|');
    ctx.font='700 34px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
    const w=ctx.measureText(bt).width+44,h=58,bx=right?x0+24:24,by=24;
    ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=12;ctx.shadowOffsetY=3;
    ctx.fillStyle=bg;rr(ctx,bx,by,w,h,14);ctx.fill();ctx.restore();
    ctx.fillStyle=fg;ctx.fillText(bt,bx+w/2,by+h/2+2);
  }
  // লোগো
  if(logoImg){
    const hh=62,ww=Math.min(220,logoImg.width*hh/logoImg.height),px=16,py=10;
    const bx=right?x0+22:W-(ww+px*2)-22,by=H-(hh+py*2)-22;
    ctx.fillStyle='rgba(255,255,255,.9)';rr(ctx,bx,by,ww+px*2,hh+py*2,16);ctx.fill();
    ctx.drawImage(logoImg,bx+px,by+py,ww,hh);
  }
  // বর্ডার
  const bd=$('border').value;
  if(bd!=='none'){ctx.strokeStyle=bd;ctx.lineWidth=14;ctx.strokeRect(7,7,W-14,H-14)}
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.globalAlpha=1;ctx.filter='none';
  $('gapVal').textContent=BNUM($('gap').value);
  $('panVal').textContent=BNUM($('pan').value);
  $('briVal').textContent=BNUM($('bri').value);$('conVal').textContent=BNUM($('con').value);$('satVal').textContent=BNUM($('sat').value);
  drawBase();drawText();drawExtras();
}
function draw(){cancelAnimationFrame(raf);raf=requestAnimationFrame(render)}
function refreshAllPreviews(){[...$('rows').children].forEach(refreshRowPreview)}

/* ---------- সংরক্ষণ (এই ডিভাইসে) ---------- */
const PK=['side','pcol','glow','edge','border','bcol','pan','tscale','gap','bri','con','sat'];
function savePrefs(extra){
  try{
    const old=JSON.parse(localStorage.getItem('thumb-prefs2')||'{}');
    const s={logo:old.logo};PK.forEach(k=>s[k]=$(k).value);
    if(extra&&'logo' in extra)s.logo=extra.logo;
    localStorage.setItem('thumb-prefs2',JSON.stringify(s));
  }catch(e){}
}
function loadPrefs(){
  try{
    const s=JSON.parse(localStorage.getItem('thumb-prefs2')||'{}');
    PK.forEach(k=>{if(typeof s[k]==='string'){const el=$(k);if(el.options?[...el.options].some(o=>o.value===s[k]):true)el.value=s[k]}});
    if(s.logo){const im=new Image();im.onload=()=>{logoImg=im;$('logoClear').style.display='inline-block';$('logoLbl').textContent='লোগো বদলান';draw()};im.src=s.logo}
  }catch(e){}
}
loadPrefs();refreshAllPreviews();
['zoom','px','py',...PK,'badge'].forEach(id=>{
  const ev=()=>{savePrefs();draw()};
  $(id).addEventListener('input',ev);$(id).addEventListener('change',ev);
});
$('photo').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{photo=img;$('photoLbl').textContent='ছবি বদলান';$('zoom').value=100;$('px').value=50;$('py').value=30;draw()};
  img.onerror=()=>{$('msg').textContent='ছবিটি খোলা যায়নি, অন্য ছবি দিন।'};
  img.src=url;
});
$('logoFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
    logoImg=im;$('logoClear').style.display='inline-block';$('logoLbl').textContent='লোগো বদলান';
    try{const s=Math.min(1,400/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);savePrefs({logo:c.toDataURL('image/png')})}catch(err){}
    draw();
  };
  im.src=url;
});
$('logoClear').addEventListener('click',()=>{logoImg=null;$('logoClear').style.display='none';$('logoLbl').textContent='চ্যানেলের লোগো বাছুন';savePrefs({logo:''});draw()});

/* ---------- সেভ ---------- */
function getBlob(){return new Promise(res=>cv.toBlob(res,'image/jpeg',.93))}
let claudeDl=null,claudeTried=false;
async function dlns(){if(claudeTried)return claudeDl;claudeTried=true;try{claudeDl=window.claude&&await window.claude.use('downloads')}catch(e){claudeDl=null}return claudeDl}
dlns();
function showFallback(blob){$('outImg').src=URL.createObjectURL(blob);$('fallback').style.display='block';setTimeout(()=>$('fallback').scrollIntoView({behavior:'smooth',block:'start'}),50)}
function anchorDownload(blob,name){try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1500);return true}catch(e){return false}}
$('save').addEventListener('click',async()=>{
  $('msg').textContent='ছবি তৈরি হচ্ছে...';
  render();await new Promise(r=>setTimeout(r,150));
  const blob=await getBlob();
  if(!blob){$('msg').textContent='ছবি তৈরি করা যায়নি, আবার চেষ্টা করুন।';return}
  const name='thumbnail-'+Date.now()+'.jpg';
  showFallback(blob);
  const dl=await dlns();
  if(dl){
    try{await dl.save({filename:name,data:blob});$('msg').textContent='সেভ হয়েছে। না পেলে নিচের ছবি চেপে ধরে সংরক্ষণ করুন।';return}
    catch(e){if(e&&e.code==='declined'){$('msg').textContent='সেভ বাতিল করা হয়েছে। চাইলে নিচের ছবি চেপে ধরে সংরক্ষণ করুন।';return}}
  }
  $('msg').textContent=anchorDownload(blob,name)?'ডাউনলোড শুরু হয়েছে। না হলে নিচের ছবি চেপে ধরে "ছবি সংরক্ষণ" দিন।':'নিচের ছবি চেপে ধরে "ছবি সংরক্ষণ" দিন।';
});
(async()=>{try{const b=await getBlob();const f=new File([b],'t.jpg',{type:'image/jpeg'});if(navigator.canShare&&navigator.canShare({files:[f]}))$('share').style.display='block'}catch(e){}})();
$('share').addEventListener('click',async()=>{try{const b=await getBlob();await navigator.share({files:[new File([b],'thumbnail.jpg',{type:'image/jpeg'})]})}catch(e){$('msg').textContent='শেয়ার করা যায়নি, সেভ বাটন ব্যবহার করুন।'}});

draw();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>{refreshAllPreviews();draw()})}
$('fontFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{
    const o={id:Date.now().toString(36),name:f.name.replace(/\.[^.]+$/,''),buf:await f.arrayBuffer()};
    const key=await registerCustom(o);
    let saved=true;try{await idbPut(o)}catch(err){saved=false}
    if(activeRow){activeRow.dataset.font=key;updFontBtn(activeRow);refreshRowPreview(activeRow)}
    closeSheet();draw();
    $('msg').textContent=saved?'ফন্ট যোগ হয়েছে, এটা এই ফোনে সেভ থাকবে।':'ফন্ট যোগ হয়েছে, কিন্তু এই ব্রাউজারে সেভ রাখা যায়নি (বন্ধ করলে আবার যোগ করতে হবে)।';
  }catch(err){$('msg').textContent='ফন্টটি খোলা যায়নি। .ttf বা .otf ফাইল দিন।'}
});
idbAll().then(async list=>{for(const o of list){try{await registerCustom(o)}catch(e){}}refreshAllPreviews();draw()}).catch(()=>{});
</script>
</body>
</html>
